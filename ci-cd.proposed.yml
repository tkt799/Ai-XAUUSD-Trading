# ===========================================================================
# 注意 / NOTE (2026-08-10)：本文件是【待启用】的新版 CI 配置。
# 智能体的 GitHub App token 缺少 workflows 权限，无法直接推送对
# .github/workflows/ 的修改，因此新配置先以本文件形式提交。
#
# 启用方法（任选其一，需要仓库写权限）：
#   1) 在 GitHub 网页端编辑 .github/workflows/ci-cd.yml，粘贴本文件内容后提交；
#   2) 本地：cp ci-cd.proposed.yml .github/workflows/ci-cd.yml 后提交推送。
# 启用后请删除本文件。各任务说明见文件内注释。
# ===========================================================================
name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8/3.9 excluded: pandas 2.1.4 requires >= 3.9; torch 2.1.0 wheels cap at 3.11
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # CPU-only torch keeps CI fast and within runner disk limits;
        # requirements.txt then sees its torch==2.1.0 pin already satisfied.
        pip install torch==2.1.0 --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run linting
      run: |
        # Fatal-error classes gate the build (flat layout — lint the repo root)
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
          --exclude=.git,docs,arxiv_submission,__pycache__
        # Full report is informational
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics \
          --exclude=.git,docs,arxiv_submission,__pycache__

    - name: Run type checking (informational)
      continue-on-error: true
      run: |
        mypy . --ignore-missing-imports --explicit-package-bases \
          --exclude 'docs/|arxiv_submission/|build/'

    - name: Run tests
      run: |
        pytest -v --cov --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  deploy:
    # Manual release only (Actions → "Run workflow"). Requires PYPI_API_TOKEN secret.
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/*

  docker:
    # Pushes to GHCR under THIS repository (fork-friendly, uses GITHUB_TOKEN —
    # no Docker Hub secrets needed). Runs on main pushes and manual dispatch.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  docs:
    # Manual only for now — docs/ has no Sphinx scaffolding (no conf.py/Makefile) yet.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install docs dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install sphinx sphinx-rtd-theme

    - name: Build documentation (HTML only — no LaTeX toolchain in CI)
      run: python build_docs.py --html-only

    - name: Upload docs artifact
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: docs/build/html/
        if-no-files-found: ignore
